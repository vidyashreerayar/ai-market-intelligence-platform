<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Intersnack platform architecture</title>
<desc>Flowchart showing data flow from NewsAPI and Eurostat sources through ETL, storage, AI routing, to the Streamlit UI</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="580" fill="#ffffff"/>

<!-- Tier A: sources -->
<rect x="60" y="40" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="190" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">scrapers/news_api.py</text>
<text x="190" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">fetches from NewsAPI</text>

<rect x="360" y="40" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="490" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">etl/extract.py</text>
<text x="490" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">fetches from Eurostat</text>

<path d="M190 84 L190 104 L140 104 L140 124" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M490 84 L490 104 L540 104 L540 124" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier B: ETL chain -->
<rect x="50" y="124" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="140" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Extract</text>

<rect x="250" y="124" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Transform</text>

<rect x="450" y="124" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="540" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Load</text>

<line x1="230" y1="146" x2="248" y2="146" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="430" y1="146" x2="448" y2="146" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M540 168 L540 188 L190 188 L190 208" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier C: storage -->
<rect x="60" y="208" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="190" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">PostgreSQL</text>
<text x="190" y="246" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">news_articles, potato_prices</text>

<rect x="360" y="208" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="490" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">news_embeddings</text>
<text x="490" y="246" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">vector index, via indexer.py</text>

<line x1="320" y1="236" x2="358" y2="236" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M190 264 L190 284 L340 284 L340 304" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M490 264 L490 284 L340 284" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>

<!-- Tier D: supervisor -->
<rect x="210" y="304" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="324" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">supervisor.py</text>
<text x="340" y="342" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">classifies intent, routes query</text>

<path d="M340 360 L340 380 L100 380 L100 400" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 360 L340 380 L260 380 L260 400" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 360 L340 380 L420 380 L420 400" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 360 L340 380 L580 380 L580 400" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier E: agents -->
<rect x="30" y="400" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="100" y="422" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">News agent</text>
<text x="100" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">general news</text>

<rect x="190" y="400" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="260" y="422" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Market agent</text>
<text x="260" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">competitors</text>

<rect x="350" y="400" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="420" y="422" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Trend agent</text>
<text x="420" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">consumer trends</text>

<rect x="510" y="400" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="580" y="422" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Pricing agent</text>
<text x="580" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">potato prices</text>

<path d="M100 456 L100 476 L340 476 L340 496" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M260 456 L260 476 L340 476" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M420 456 L420 476 L340 476" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M580 456 L580 476 L340 476" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>

<!-- Tier F: UI -->
<rect x="210" y="496" width="260" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="340" y="511" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">app.py</text>
<text x="340" y="528" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Streamlit UI, shows answer + sources</text>

</svg>
